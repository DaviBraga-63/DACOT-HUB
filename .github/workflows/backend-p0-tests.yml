name: Backend P0 tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-tests:
    name: Isolated backend P0 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      P0_ORDERS_BACKEND: ${{ github.workspace }}/DACOT-PEDIDOS/backend

    steps:
      - name: Check out DACOT Hub
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out DACOT Pedidos
        uses: actions/checkout@v4
        with:
          repository: 12345juniormen-glitch/DACOT-PEDIDOS
          ref: main
          path: DACOT-PEDIDOS
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local MongoDB binary
        uses: ankane/setup-mongodb@v1
        with:
          mongodb-version: "8.0"

      - name: Configure isolated test paths
        shell: bash
        run: |
          set -euo pipefail
          MONGOD_PATH="$(command -v mongod)"
          test -x "$MONGOD_PATH"
          test -f "$P0_ORDERS_BACKEND/requirements.txt"
          echo "P0_MONGOD=$MONGOD_PATH" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r "$P0_ORDERS_BACKEND/requirements.txt"

      - name: Run isolated P0 tests
        run: python -m pytest -c backend/pytest.ini backend/p0_tests
