name: Backend P0 tests

on:
  workflow_dispatch:
    inputs:
      pedidos_ref:
        description: "Branch, tag ou SHA do DACOT-PEDIDOS para validar"
        required: true
        default: "validation/tenant-user-revocation"
        type: string

permissions:
  contents: read

jobs:
  p0-tests:
    name: Isolated backend P0 tests
    # MongoDB's pinned Ubuntu 24.04 binary is verified below. Do not rely on
    # apt repositories whose availability changes with ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P0_ORDERS_BACKEND: ${{ github.workspace }}/DACOT-PEDIDOS/backend

    steps:
      - name: Check out DACOT Hub
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out DACOT Pedidos
        uses: actions/checkout@v4
        with:
          repository: 12345juniormen-glitch/DACOT-PEDIDOS
          ref: ${{ inputs.pedidos_ref }}
          path: DACOT-PEDIDOS
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verified temporary MongoDB binary
        shell: bash
        run: |
          set -euo pipefail
          MONGO_VERSION="8.0.29"
          MONGO_ARCHIVE="mongodb-linux-x86_64-ubuntu2404-${MONGO_VERSION}.tgz"
          MONGO_SHA256="c897be96bdda032de38881f61add98348adb0022bd9766a6956160951b96ed00"
          MONGO_ROOT="$RUNNER_TEMP/mongodb-${MONGO_VERSION}"
          curl --fail --silent --show-error --location \
            "https://fastdl.mongodb.org/linux/${MONGO_ARCHIVE}" \
            --output "$RUNNER_TEMP/${MONGO_ARCHIVE}"
          printf '%s  %s\n' "$MONGO_SHA256" "$RUNNER_TEMP/${MONGO_ARCHIVE}" | sha256sum --check --status
          mkdir -p "$MONGO_ROOT"
          tar -xzf "$RUNNER_TEMP/${MONGO_ARCHIVE}" --strip-components=1 -C "$MONGO_ROOT"
          test -x "$MONGO_ROOT/bin/mongod"
          echo "$MONGO_ROOT/bin" >> "$GITHUB_PATH"

      - name: Configure isolated test paths
        shell: bash
        run: |
          set -euo pipefail
          MONGOD_PATH="$(command -v mongod)"
          test -x "$MONGOD_PATH"
          test -f "$P0_ORDERS_BACKEND/requirements.txt"
          echo "P0_MONGOD=$MONGOD_PATH" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r "$P0_ORDERS_BACKEND/requirements.txt"

      - name: Run isolated P0 tests
        run: python -m pytest -c backend/pytest.ini backend/p0_tests

  browser-e2e:
    name: Browser revocation E2E
    needs: p0-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUB_API: http://localhost:8443
      HUB_UI: https://localhost:9443
      ORDERS_API: http://localhost:8444
      ORDERS_UI: https://localhost:9444
      E2E_HUB_API: http://localhost:8443
      E2E_HUB_UI: https://localhost:9443
      E2E_ORDERS_API: http://localhost:8444
      E2E_ORDERS_UI: https://localhost:9444
      E2E_RESULTS_FILE: ${{ github.workspace }}/e2e-results.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 12345juniormen-glitch/DACOT-PEDIDOS
          ref: ${{ inputs.pedidos_ref }}
          path: DACOT-PEDIDOS
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install verified temporary MongoDB binary
        shell: bash
        run: |
          set -euo pipefail
          MONGO_VERSION="8.0.29"
          MONGO_ARCHIVE="mongodb-linux-x86_64-ubuntu2404-${MONGO_VERSION}.tgz"
          MONGO_SHA256="c897be96bdda032de38881f61add98348adb0022bd9766a6956160951b96ed00"
          MONGO_ROOT="$RUNNER_TEMP/mongodb-${MONGO_VERSION}"
          curl --fail --silent --show-error --location \
            "https://fastdl.mongodb.org/linux/${MONGO_ARCHIVE}" \
            --output "$RUNNER_TEMP/${MONGO_ARCHIVE}"
          printf '%s  %s\n' "$MONGO_SHA256" "$RUNNER_TEMP/${MONGO_ARCHIVE}" | sha256sum --check --status
          mkdir -p "$MONGO_ROOT"
          tar -xzf "$RUNNER_TEMP/${MONGO_ARCHIVE}" --strip-components=1 -C "$MONGO_ROOT"
          test -x "$MONGO_ROOT/bin/mongod"
          echo "$MONGO_ROOT/bin" >> "$GITHUB_PATH"
      - name: Install backend and frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r DACOT-PEDIDOS/backend/requirements.txt
          (cd frontend && yarn install --frozen-lockfile)
          (cd DACOT-PEDIDOS/frontend && yarn install --frozen-lockfile)
          (cd frontend && yarn playwright install --with-deps chromium)
      - name: Test Pedidos authentication context
        run: cd DACOT-PEDIDOS/frontend && CI=true yarn test --watch=false --runInBand src/context/AuthContext.test.jsx
      - name: Start isolated MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          MONGO_DATA="$RUNNER_TEMP/mongodb-e2e-data"
          MONGO_LOG="$RUNNER_TEMP/mongodb-e2e.log"
          mkdir -p "$MONGO_DATA"
          mongod --bind_ip 127.0.0.1 --port 27017 --dbpath "$MONGO_DATA" --replSet e2e --fork --logpath "$MONGO_LOG"
          python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient("mongodb://127.0.0.1:27017/?directConnection=true", serverSelectionTimeoutMS=1000)
          for _ in range(30):
              try:
                  status = client.admin.command("replSetGetStatus")
                  if status.get("myState") == 1:
                      break
              except Exception:
                  try:
                      client.admin.command("replSetInitiate", {"_id": "e2e", "members": [{"_id": 0, "host": "127.0.0.1:27017"}]})
                  except Exception:
                      pass
              time.sleep(1)
          else:
              raise SystemExit("isolated MongoDB replica set did not become primary")
          PY
      - name: Start isolated HUB, PEDIDOS and frontends
        shell: bash
        run: |
          set -euo pipefail
          export E2E_ADMIN_EMAIL=admin-e2e@example.com
          export E2E_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export E2E_EMPLOYEE_PASSWORD="$(openssl rand -hex 24)"
          export APP_ENV=development DACOT_LOCAL_INTEGRATION=1 MONGO_URL=mongodb://127.0.0.1:27017
          export JWT_SECRET="$(openssl rand -hex 32)"
          export HANDOFF_JWT_SECRET="$(openssl rand -hex 32)"
          export MODULE_API_KEY="$(openssl rand -hex 32)"
          export HANDOFF_ISSUER=dacot-hub HANDOFF_AUDIENCE=dacot-orders HANDOFF_VERSION=1 HANDOFF_MODULE_ID=orders
          export HANDOFF_ALLOWED_ORIGINS_JSON='{"orders":["https://localhost:9444"]}'
          export HUB_BASE_URL="$HUB_API" ORDERS_BACKEND_URL="$ORDERS_API" ORDERS_FRONTEND_URL="$ORDERS_UI"
          export FRONTEND_URL="$HUB_UI" CORS_ORIGINS="$ORDERS_UI"
          export ADMIN_EMAIL="$E2E_ADMIN_EMAIL" ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD"
          export E2E_TLS_CA="$RUNNER_TEMP/dacot-e2e-ca.pem" E2E_TLS_CA_KEY="$RUNNER_TEMP/dacot-e2e-ca-key.pem"
          export E2E_TLS_KEY="$RUNNER_TEMP/dacot-e2e-key.pem" E2E_TLS_CSR="$RUNNER_TEMP/dacot-e2e.csr" E2E_TLS_CERT="$RUNNER_TEMP/dacot-e2e-cert.pem"
          openssl req -x509 -nodes -newkey rsa:2048 -keyout "$E2E_TLS_CA_KEY" -out "$E2E_TLS_CA" -days 1 -subj '/CN=DACOT E2E Local CA' \
            -addext 'basicConstraints=critical,CA:true' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -new -nodes -newkey rsa:2048 -keyout "$E2E_TLS_KEY" -out "$E2E_TLS_CSR" -subj '/CN=localhost' >/dev/null 2>&1
          printf '%s\n' 'basicConstraints=critical,CA:false' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' 'subjectAltName=DNS:localhost' > "$RUNNER_TEMP/dacot-e2e-leaf.ext"
          openssl x509 -req -in "$E2E_TLS_CSR" -CA "$E2E_TLS_CA" -CAkey "$E2E_TLS_CA_KEY" -CAcreateserial -out "$E2E_TLS_CERT" -days 1 -sha256 -extfile "$RUNNER_TEMP/dacot-e2e-leaf.ext" >/dev/null 2>&1
          openssl verify -purpose sslserver -CAfile "$E2E_TLS_CA" "$E2E_TLS_CERT"
          openssl x509 -in "$E2E_TLS_CERT" -noout -text | grep -F 'DNS:localhost' >/dev/null
          sudo install -m 0644 "$E2E_TLS_CA" /usr/local/share/ca-certificates/dacot-e2e-local-ca.crt
          sudo update-ca-certificates >/dev/null
          if ! command -v certutil >/dev/null; then sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y libnss3-tools; fi
          mkdir -p "$HOME/.pki/nssdb"
          test -f "$HOME/.pki/nssdb/cert9.db" || certutil -d sql:"$HOME/.pki/nssdb" -N --empty-password
          certutil -d sql:"$HOME/.pki/nssdb" -D -n dacot-e2e-local-ca 2>/dev/null || true
          certutil -d sql:"$HOME/.pki/nssdb" -A -n dacot-e2e-local-ca -t 'C,,' -i "$E2E_TLS_CA"
          export NODE_EXTRA_CA_CERTS="$E2E_TLS_CA"
          printf '%s\n' "$JWT_SECRET" "$HANDOFF_JWT_SECRET" "$MODULE_API_KEY" "$E2E_ADMIN_PASSWORD" "$E2E_EMPLOYEE_PASSWORD" | sed 's/^/::add-mask::/'
          printf 'E2E_ADMIN_EMAIL=%s\nE2E_ADMIN_PASSWORD=%s\nE2E_EMPLOYEE_PASSWORD=%s\nE2E_TLS_CA=%s\n' "$E2E_ADMIN_EMAIL" "$E2E_ADMIN_PASSWORD" "$E2E_EMPLOYEE_PASSWORD" "$E2E_TLS_CA" >> "$GITHUB_ENV"
          (cd backend && DB_NAME=hub_e2e python -m uvicorn server:app --host 0.0.0.0 --port 8443 > "$RUNNER_TEMP/hub-e2e.log" 2>&1 & echo $! > "$RUNNER_TEMP/hub-e2e.pid")
          (cd DACOT-PEDIDOS/backend && DB_NAME=orders_e2e python -m uvicorn server:app --host 0.0.0.0 --port 8444 > "$RUNNER_TEMP/orders-e2e.log" 2>&1 & echo $! > "$RUNNER_TEMP/orders-e2e.pid")
          (cd frontend && HOST=0.0.0.0 PORT=3000 BROWSER=none REACT_APP_BACKEND_URL= yarn start > "$RUNNER_TEMP/hub-frontend-e2e.log" 2>&1 & echo $! > "$RUNNER_TEMP/hub-frontend-e2e.pid")
          (cd DACOT-PEDIDOS/frontend && HOST=0.0.0.0 PORT=3001 BROWSER=none REACT_APP_BACKEND_URL= yarn start > "$RUNNER_TEMP/orders-frontend-e2e.log" 2>&1 & echo $! > "$RUNNER_TEMP/orders-frontend-e2e.pid")
          (E2E_HTTPS_PROXY_PORT=9443 E2E_HTTPS_FRONTEND_PORT=3000 E2E_HTTPS_API_PORT=8443 node frontend/e2e/https-proxy.js > "$RUNNER_TEMP/hub-proxy-e2e.log" 2>&1 & echo $! > "$RUNNER_TEMP/hub-proxy-e2e.pid")
          (E2E_HTTPS_PROXY_PORT=9444 E2E_HTTPS_FRONTEND_PORT=3001 E2E_HTTPS_API_PORT=8444 node frontend/e2e/https-proxy.js > "$RUNNER_TEMP/orders-proxy-e2e.log" 2>&1 & echo $! > "$RUNNER_TEMP/orders-proxy-e2e.pid")
      - name: Wait for local services
        shell: bash
        run: |
          set -euo pipefail
          wait_for() { for _ in $(seq 1 120); do curl --fail --silent --show-error "$@" >/dev/null && return 0; sleep 1; done; return 1; }
          wait_for "$HUB_API/openapi.json"
          wait_for "$ORDERS_API/api/health"
          wait_for --cacert "$E2E_TLS_CA" "$HUB_UI/login"
          wait_for --cacert "$E2E_TLS_CA" "$ORDERS_UI/login"
          NODE_EXTRA_CA_CERTS="$E2E_TLS_CA" node -e 'require("https").get(process.argv[1], response => { if (response.statusCode !== 200) process.exitCode = 1; response.resume(); }).on("error", error => { console.error(error.message); process.exitCode = 1; })' "$ORDERS_UI/login"
      - name: Run real Chromium revocation E2E
        run: cd frontend && E2E_HEADED=1 xvfb-run -a yarn playwright test
      - name: Verify logical deletion persisted in isolated MongoDB
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$E2E_RESULTS_FILE"
          tenant_id="$(jq -r '.tenant.id // empty' "$E2E_RESULTS_FILE")"
          user_id="$(jq -r '.tenant.user_id // empty' "$E2E_RESULTS_FILE")"
          test -n "$tenant_id" && test -n "$user_id"
          deleted_tenant_id="$(jq -r '.deleted_tenant.id // empty' "$E2E_RESULTS_FILE")"
          deleted_tenant_user_id="$(jq -r '.deleted_tenant.user_id // empty' "$E2E_RESULTS_FILE")"
          deleted_staff_id="$(jq -r '.deleted_staff.id // empty' "$E2E_RESULTS_FILE")"
          test -n "$deleted_tenant_id" && test -n "$deleted_tenant_user_id" && test -n "$deleted_staff_id"
          export E2E_TENANT_ID="$tenant_id" E2E_USER_ID="$user_id"
          export E2E_DELETED_TENANT_ID="$deleted_tenant_id" E2E_DELETED_TENANT_USER_ID="$deleted_tenant_user_id" E2E_DELETED_STAFF_ID="$deleted_staff_id"
          python - <<'PY'
          import os
          from bson import ObjectId
          from pymongo import MongoClient

          db = MongoClient("mongodb://127.0.0.1:27017/hub_e2e", serverSelectionTimeoutMS=5000).get_database()
          active_tenant = db.tenants.find_one({"_id": ObjectId(os.environ["E2E_TENANT_ID"])})
          active_user = db.tenant_users.find_one({"_id": ObjectId(os.environ["E2E_USER_ID"])})
          if not active_tenant or active_tenant.get("deleted_at") or not active_user or not active_user.get("deleted_at"):
              raise SystemExit("logical deletion verification failed")
          deleted_tenant = db.tenants.find_one({"_id": ObjectId(os.environ["E2E_DELETED_TENANT_ID"])})
          deleted_user = db.tenant_users.find_one({"_id": ObjectId(os.environ["E2E_DELETED_TENANT_USER_ID"])})
          deleted_staff = db.hub_users.find_one({"_id": ObjectId(os.environ["E2E_DELETED_STAFF_ID"])})
          if not deleted_tenant or not deleted_tenant.get("deleted_at") or not deleted_user or not deleted_staff or not deleted_staff.get("deleted_at"):
              raise SystemExit("logical deletion data-preservation verification failed")
          print("logical deletion and data preservation verified")
          PY
          jq '{pages, backend}' "$E2E_RESULTS_FILE"
      - name: Upload sanitized E2E evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: ${{ env.E2E_RESULTS_FILE }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
            ${{ env.E2E_RESULTS_FILE }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local services
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP"/*-e2e.pid; do test -f "$file" && kill "$(cat "$file")" 2>/dev/null || true; done
